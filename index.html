                if (res) setVapeResult(res);
            };

            const stepLabels    = ['Device', 'Issue', 'Model & Quality', 'Confirm'];
            const progressPct   = ((funnelStep - 1) / 3) * 100;
            const waMsg         = encodeURIComponent("Hi Windsor Express! I'd like to book a repair / get a quote.");

            // ── FUNNEL ──
            const renderFunnel = () => (
                <div className="max-w-2xl mx-auto bg-white rounded-3xl shadow-2xl border border-gray-100 overflow-hidden relative">
                    {isSubmitting && (
                        <div className="absolute inset-0 bg-white/90 z-50 flex flex-col items-center justify-center">
                            <div className="w-14 h-14 border-4 border-brand-100 border-t-brand-500 rounded-full animate-spin mb-4"></div>
                            <p className="font-bold text-gray-700">Locking in your slot...</p>
                        </div>
                    )}

                    {/* Header + progress */}
                    <div className="bg-gray-50 border-b border-gray-100 p-5">
                        <div className="flex justify-between items-center mb-3">
                            <h3 className="font-display text-2xl font-black text-gray-900">Book Your Repair</h3>
                            <span className="text-xs font-bold text-brand-600 bg-brand-50 px-3 py-1.5 rounded-full">Step {funnelStep} / 4</span>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-1.5 mb-2">
                            <div className="bg-brand-500 h-1.5 rounded-full progress-bar-fill" style={{ width: `${progressPct}%` }}></div>
                        </div>
                        <div className="flex justify-between">
                            {stepLabels.map((l, i) => (
                                <span key={i} className={`text-xs font-medium ${i + 1 <= funnelStep ? 'text-brand-600' : 'text-gray-300'}`}>{l}</span>
                            ))}
                        </div>
                    </div>

                    <div className="p-6 md:p-8 min-h-[400px]">

                        {/* STEP 1 */}
                        {funnelStep === 1 && (
                            <div className="fade-in">
                                <div className="flex bg-gray-100 rounded-xl p-1 mb-7 max-w-xs mx-auto">
                                    {['walk-in', 'mail-in'].map(t => (
                                        <button key={t} onClick={() => setBookingData({ ...bookingData, serviceType: t })}
                                            className={`flex-1 py-2.5 rounded-lg font-bold text-xs md:text-sm transition-all ${bookingData.serviceType === t ? 'bg-white shadow text-brand-600' : 'text-gray-400 hover:text-gray-600'}`}>
                                            <i className={`fas ${t === 'walk-in' ? 'fa-store' : 'fa-box'} mr-1.5`}></i>
                                            {t === 'walk-in' ? 'Walk-in' : 'Mail-in (UK)'}
                                        </button>
                                    ))}
                                </div>
                                <h4 className="font-display text-3xl font-black text-gray-900 text-center mb-7">What needs fixing?</h4>
                                <div className="grid grid-cols-2 gap-4 mb-4">
                                    {[
                                        { brand: 'Apple iPhone',  iconClass: 'fab fa-apple',           color: 'text-gray-800' },
                                        { brand: 'Samsung',       iconClass: 'fas fa-mobile-android',  color: 'text-blue-600' }
                                    ].map(({ brand, iconClass, color }) => (
                                        <div key={brand} onClick={() => handleBrand(brand)}
                                            className="funnel-card border-gray-200 rounded-2xl p-7 text-center bg-white card-shine">
                                            <i className={`${iconClass} text-5xl mb-4 ${color} block`}></i>
                                            <div className="font-bold text-gray-900">{brand}</div>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => handleBrand('Other / iPad / Laptop')}
                                    className="w-full text-gray-400 text-sm font-semibold hover:text-brand-500 transition-colors py-3 underline underline-offset-2">
                                    Other brand or device →
                                </button>
                            </div>
                        )}

                        {/* STEP 2 — issue */}
                        {funnelStep === 2 && !showAIPrompt && (
                            <div className="fade-in">
                                <button onClick={() => setFunnelStep(1)} className="flex items-center gap-1.5 text-sm text-gray-400 font-semibold mb-6 hover:text-brand-500 transition-colors">
                                    <i className="fas fa-arrow-left text-xs"></i> Back
                                </button>
                                <h4 className="font-display text-3xl font-black text-gray-900 text-center mb-7">What's the problem?</h4>

                                {aiDiagnosisMsg && (
                                    <div className="mb-5 p-4 bg-indigo-50 rounded-xl border border-indigo-100 text-indigo-700 text-sm font-medium flex gap-3 items-start">
                                        <i className="fas fa-robot mt-0.5 flex-shrink-0"></i>
                                        <span>{aiDiagnosisMsg}</span>
                                    </div>
                                )}

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                                    {[
                                        { issue: 'Screen',  icon: 'fa-burst',          label: 'Broken Screen'   },
                                        { issue: 'Battery', icon: 'fa-battery-quarter', label: 'Battery Issue'   },
                                        { issue: 'Other',   icon: 'fa-plug',            label: 'Something Else'  }
                                    ].map(({ issue, icon, label }) => (
                                        <div key={issue} onClick={() => handleIssue(issue)}
                                            className="funnel-card border-gray-200 rounded-2xl p-5 text-center card-shine">
                                            <i className={`fas ${icon} text-3xl mb-3 text-brand-500 block`}></i>
                                            <div className="font-bold text-gray-800 text-sm md:text-base">{label}</div>
                                        </div>
                                    ))}
                                </div>
                                <div onClick={() => setShowAIPrompt(true)}
                                    className="funnel-card border-indigo-200 bg-gradient-to-br from-indigo-50 to-violet-50 rounded-2xl p-5 text-center text-indigo-700 card-shine">
                                    <i className="fas fa-robot text-2xl mb-1.5 block"></i>
                                    <div className="font-bold text-sm md:text-base">Not sure? AI Diagnosis ✨</div>
                                    <div className="text-xs text-indigo-400 font-medium mt-1">Describe it and we'll figure it out</div>
                                </div>
                            </div>
                        )}

                        {/* STEP 2 — AI prompt */}
                        {funnelStep === 2 && showAIPrompt && (
                            <div className="fade-in">
                                <button onClick={() => setShowAIPrompt(false)} className="flex items-center gap-1.5 text-sm text-gray-400 font-semibold mb-6 hover:text-brand-500 transition-colors">
                                    <i className="fas fa-arrow-left text-xs"></i> Back
                                </button>
                                <h4 className="font-display text-3xl font-black text-gray-900 text-center mb-2">Describe the Issue</h4>
                                <p className="text-gray-400 text-sm font-medium text-center mb-6">Be as specific as you like — the more detail the better</p>
                                <form onSubmit={handleAIDiagnosis} className="space-y-4">
                                    <textarea value={aiInput} onChange={e => setAiInput(e.target.value)}
                                        className="w-full p-4 border-2 border-indigo-100 focus:border-indigo-400 rounded-2xl outline-none min-h-[120px] resize-none font-medium text-gray-700 placeholder-gray-300 transition-colors"
                                        placeholder="e.g. Screen is flickering at the top and there's a faint green line..." required />
                                    <button type="submit" disabled={isAILoading}
                                        className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition-colors disabled:opacity-50 flex items-center justify-center gap-2">
                                        {isAILoading
                                            ? <><div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> Analysing...</>
                                            : <><i className="fas fa-wand-magic-sparkles"></i> Diagnose My Phone</>}
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* STEP 3 — model & quality */}
                        {funnelStep === 3 && (
                            <div className="fade-in">
                                <button onClick={() => setFunnelStep(2)} className="flex items-center gap-1.5 text-sm text-gray-400 font-semibold mb-6 hover:text-brand-500 transition-colors">
                                    <i className="fas fa-arrow-left text-xs"></i> Back
                                </button>
                                <h4 className="font-display text-3xl font-black text-gray-900 text-center mb-6">Model & Screen Quality</h4>

                                <div className="mb-6">
                                    <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">iPhone Model</label>
                                    <select onChange={e => setBookingData({ ...bookingData, model: e.target.value, quality: '', quotedPrice: '' })} value={bookingData.model}
                                        className="w-full p-4 border-2 border-gray-200 focus:border-brand-500 rounded-xl outline-none bg-white font-medium text-gray-700 transition-colors">
                                        <option value="">— Choose your model —</option>
                                        {Object.keys(IPHONE_PRICES).map(m => <option key={m} value={m}>{m}</option>)}
                                    </select>
                                </div>

                                {bookingData.model && (
                                    <div className="space-y-3">
                                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Screen Quality</label>
                                        {Object.entries(IPHONE_PRICES[bookingData.model]).map(([key, price]) => {
                                            const t = TIER_META[key];
                                            return (
                                                <div key={key} onClick={() => handleQualitySelect(key, price)}
                                                    className={`funnel-card ${t.border} border-gray-200 rounded-xl p-4 flex justify-between items-center ${t.bg}`}>
                                                    <div>
                                                        <div className={`font-black text-base ${t.textColor}`}>{t.label} Screen</div>
                                                        <div className="text-gray-400 text-xs font-medium mt-0.5">{t.tagline}</div>
                                                    </div>
                                                    <div className="font-display text-3xl font-black text-gray-800">£{price.toFixed(2)}</div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* STEP 4 — confirm */}
                        {funnelStep === 4 && (
                            <div className="fade-in">
                                <button onClick={() => setFunnelStep(bookingData.brand === 'Apple iPhone' && bookingData.issue === 'Screen' ? 3 : 2)}
                                    className="flex items-center gap-1.5 text-sm text-gray-400 font-semibold mb-5 hover:text-brand-500 transition-colors">
                                    <i className="fas fa-arrow-left text-xs"></i> Back
                                </button>
                                <h4 className="font-display text-3xl font-black text-gray-900 text-center mb-5">Confirm Your Booking</h4>

                                {/* Summary */}
                                <div className="bg-gradient-to-br from-brand-50 to-green-50 border border-brand-100 rounded-2xl p-5 text-center mb-5">
                                    <div className="text-xs font-bold text-brand-600 uppercase tracking-widest mb-1">Your Repair</div>
                                    <div className="font-display text-xl font-black text-gray-900 leading-tight">
                                        {bookingData.brand} {bookingData.model} — {bookingData.issue}
                                        {bookingData.quality && <span className="text-brand-600"> ({bookingData.quality})</span>}
                                    </div>
                                    <div className="text-xs text-gray-400 font-semibold mt-1 uppercase tracking-wider">
                                        <i className={`fas ${bookingData.serviceType === 'walk-in' ? 'fa-store' : 'fa-box'} mr-1`}></i>
                                        {bookingData.serviceType === 'walk-in' ? 'Walk-in Service' : 'Mail-in Service'}
                                    </div>
                                    {bookingData.quotedPrice
                                        ? <div className="font-display text-4xl font-black text-brand-500 mt-2">{bookingData.quotedPrice}</div>
                                        : <div className="mt-3">
                                            <p className="text-xs text-gray-400 font-medium mb-1">Call for an instant quote:</p>
                                            <a href={`tel:${SHOP_PHONE}`} className="font-display text-3xl font-black text-brand-500 hover:text-brand-600 transition-colors">07912 150397</a>
                                          </div>
                                    }
                                </div>

                                <form onSubmit={submitBooking} className="space-y-3">
                                    {bookingData.brand !== 'Apple iPhone' && (
                                        <input type="text" value={bookingData.model} onChange={e => setBookingData({ ...bookingData, model: e.target.value })}
                                            placeholder="Device model (e.g. Galaxy S24 Ultra)" required
                                            className="w-full p-4 border-2 border-gray-200 focus:border-brand-500 rounded-xl outline-none font-medium placeholder-gray-300 transition-colors" />
                                    )}
                                    {bookingData.brand === 'Apple iPhone' && !bookingData.model && (
                                        <select value={bookingData.model} onChange={e => setBookingData({ ...bookingData, model: e.target.value })} required
                                            className="w-full p-4 border-2 border-gray-200 focus:border-brand-500 rounded-xl outline-none bg-white font-medium text-gray-700 transition-colors">
                                            <option value="">Select iPhone model...</option>
                                            {Object.keys(IPHONE_PRICES).map(m => <option key={m} value={m}>{m}</option>)}
                                        </select>
                                    )}
                                    <div className="grid grid-cols-2 gap-3">
                                        <input type="text" value={bookingData.name} onChange={e => setBookingData({ ...bookingData, name: e.target.value })} placeholder="Full name" required
                                            className="p-4 border-2 border-gray-200 focus:border-brand-500 rounded-xl outline-none font-medium placeholder-gray-300 transition-colors" />
                                        <input type="tel" value={bookingData.phone} onChange={e => setBookingData({ ...bookingData, phone: e.target.value })} placeholder="Phone number" required
                                            className="p-4 border-2 border-gray-200 focus:border-brand-500 rounded-xl outline-none font-medium placeholder-gray-300 transition-colors" />
                                    </div>
                                    <input type="email" value={bookingData.email} onChange={e => setBookingData({ ...bookingData, email: e.target.value })} placeholder="Email address" required
                                        className="w-full p-4 border-2 border-gray-200 focus:border-brand-500 rounded-xl outline-none font-medium placeholder-gray-300 transition-colors" />

                                    {bookingData.serviceType === 'walk-in' ? (
                                        <select value={bookingData.time} onChange={e => setBookingData({ ...bookingData, time: e.target.value })} required
                                            className="w-full p-4 border-2 border-gray-200 focus:border-brand-500 rounded-xl outline-none bg-white font-medium text-gray-700 transition-colors">
                                            <option value="">Select drop-off time...</option>
                                            {TIME_SLOTS.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                    ) : (
                                        <div>
                                            <textarea value={bookingData.address} onChange={e => setBookingData({ ...bookingData, address: e.target.value })}
                                                placeholder="Full return address (including postcode)" required
                                                className="w-full p-4 border-2 border-gray-200 focus:border-brand-500 rounded-xl outline-none min-h-[90px] font-medium placeholder-gray-300 resize-none transition-colors" />
                                            <p className="text-xs text-gray-400 font-medium mt-1.5 flex items-center gap-1">
                                                <i className="fas fa-info-circle text-brand-400"></i> We'll email prepaid postage instructions after you book.
                                            </p>
                                        </div>
                                    )}

                                    <button type="submit"
                                        className="w-full bg-brand-500 hover:bg-brand-600 text-white font-display font-black text-xl py-5 rounded-xl shadow-lg transition-colors mt-1">
                                        {bookingData.serviceType === 'walk-in' ? '🔒 Book My 30-Min Repair' : '📦 Request Mail-In Repair'}
                                    </button>
                                    <p className="text-center text-xs text-gray-400 font-medium">No payment now — pay in-store on the day.</p>
                                </form>
                            </div>
                        )}
                    </div>
                </div>
            );

            // ── SELL PAGE ──
            const renderSellPage = () => (
                <div className="max-w-2xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden fade-in relative">
                    {isSellSubmitting && (
                        <div className="absolute inset-0 bg-white/90 z-50 flex flex-col items-center justify-center">
                            <div className="w-14 h-14 border-4 border-gray-200 border-t-gray-800 rounded-full animate-spin mb-4"></div>
                            <p className="font-bold text-gray-700">Sending your request...</p>
                        </div>
                    )}
                    <div className="bg-gray-900 p-8 md:p-10 text-center relative overflow-hidden">
                        <div className="absolute inset-0 opacity-10" style={{ background: "radial-gradient(circle at 50% 50%, #10b981 0%, transparent 65%)" }}></div>
                        <div className="relative">
                            <div className="text-6xl mb-3">💸</div>
                            <h2 className="font-display text-5xl font-black text-white mb-2">Sell Your Device</h2>
                            <p className="text-gray-400 font-medium">Fast cash offer for any old or broken phone</p>
                        </div>
                    </div>
                    <div className="p-8">
                        <form onSubmit={submitSell} className="space-y-5">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">What are you selling?</label>
                                <input type="text" value={sellData.device} onChange={e => setSellData({ ...sellData, device: e.target.value })}
                                    placeholder="e.g. iPhone 13 Pro 128GB, Samsung S22 256GB" required
                                    className="w-full p-4 border-2 border-gray-200 focus:border-gray-800 rounded-xl outline-none font-medium placeholder-gray-300 transition-colors" />
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Condition</label>
                                <div className="grid grid-cols-3 gap-3">
                                    {[
                                        { val: 'Flawless',     label: 'Flawless',  sub: 'Looks brand new', icon: '✨' },
                                        { val: 'Good',         label: 'Good',      sub: 'Minor wear',      icon: '👍' },
                                        { val: 'Poor/Broken',  label: 'Broken',    sub: 'Cracked / dead',  icon: '💔' }
                                    ].map(({ val, label, sub, icon }) => (
                                        <div key={val} onClick={() => setSellData({ ...sellData, condition: val })}
                                            className={`cursor-pointer rounded-2xl p-4 text-center border-2 transition-all ${sellData.condition === val ? 'border-gray-900 bg-gray-900 text-white' : 'border-gray-200 hover:border-gray-400 bg-white'}`}>
                                            <div className="text-3xl mb-2">{icon}</div>
                                            <div className="font-bold text-sm">{label}</div>
                                            <div className={`text-xs font-medium mt-0.5 ${sellData.condition === val ? 'text-gray-400' : 'text-gray-400'}`}>{sub}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <hr className="border-gray-100" />

                            <div className="grid grid-cols-2 gap-3">
                                <input type="text" value={sellData.name} onChange={e => setSellData({ ...sellData, name: e.target.value })} placeholder="Full name" required
                                    className="p-4 border-2 border-gray-200 focus:border-gray-800 rounded-xl outline-none font-medium placeholder-gray-300 transition-colors" />
                                <input type="tel" value={sellData.phone} onChange={e => setSellData({ ...sellData, phone: e.target.value })} placeholder="Phone number" required
                                    className="p-4 border-2 border-gray-200 focus:border-gray-800 rounded-xl outline-none font-medium placeholder-gray-300 transition-colors" />
                            </div>
                            <input type="email" value={sellData.email} onChange={e => setSellData({ ...sellData, email: e.target.value })} placeholder="Email address" required
                                className="w-full p-4 border-2 border-gray-200 focus:border-gray-800 rounded-xl outline-none font-medium placeholder-gray-300 transition-colors" />

                            <button type="submit"
                                className="w-full bg-gray-900 hover:bg-black text-white font-display font-black text-xl py-5 rounded-xl shadow-lg transition-colors">
                                💰 Get My Cash Quote
                            </button>
                            <p className="text-center text-xs text-gray-400 font-medium">We'll call or email you within a few hours with your offer.</p>
                        </form>
                    </div>
                </div>
            );

            // ── RENDER ──
            return (
                <div className="min-h-screen flex flex-col">

                    {/* WhatsApp */}
                    <a href={`https://wa.me/447912150397?text=${waMsg}`} target="_blank" rel="noopener noreferrer" className="whatsapp-btn">
                        <i className="fab fa-whatsapp"></i>
                    </a>

                    {/* Mobile bottom CTA */}
                    <div className="mobile-cta-bar" style={{ display: 'none' }}>
                        <button onClick={() => setView('booking')} className="flex-1 bg-brand-500 hover:bg-brand-600 text-white font-black py-3 rounded-xl text-sm transition-colors">
                            <i className="fas fa-wrench mr-1.5"></i> Book Repair
                        </button>
                        <button onClick={() => setView('sell')} className="flex-1 bg-gray-900 hover:bg-black text-white font-black py-3 rounded-xl text-sm transition-colors">
                            <i className="fas fa-money-bill-wave mr-1.5"></i> Sell Device
                        </button>
                    </div>

                    {/* Exit intent popup */}
                    {showExit && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl">
                                <div className="bg-gradient-to-br from-brand-500 to-brand-600 p-7 text-center text-white relative">
                                    <button onClick={() => setShowExit(false)} className="absolute top-4 right-4 text-white/60 hover:text-white transition-colors">
                                        <i className="fas fa-times text-lg"></i>
                                    </button>
                                    <div className="text-5xl mb-3">🎁</div>
                                    <h2 className="font-display text-4xl font-black">Before You Go...</h2>
                                </div>
                                <div className="p-8 text-center">
                                    <h3 className="font-display text-3xl font-black text-gray-900 mb-3">Free <span className="text-brand-500">Screen Protector</span></h3>
                                    <p className="text-gray-500 font-medium mb-7 text-sm leading-relaxed">Book a repair today and we'll fit a premium tempered glass protector (worth £15) for free.</p>
                                    <div className="space-y-3">
                                        <button onClick={() => { setShowExit(false); setView('booking'); }}
                                            className="w-full bg-brand-500 hover:bg-brand-600 text-white font-black py-4 rounded-xl shadow-lg transition-colors">
                                            Claim Offer & Book Now
                                        </button>
                                        <button onClick={() => setShowExit(false)} className="w-full text-gray-400 font-medium py-2 hover:text-gray-600 transition-colors text-sm">
                                            No thanks, I'll pass
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* NAV */}
                    <nav className="glass sticky top-0 z-50 border-b border-gray-100 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 flex justify-between h-16 md:h-20 items-center">
                            <div onClick={goHome} className="flex items-center cursor-pointer group">
                                <div className="w-9 h-9 bg-brand-500 rounded-lg flex items-center justify-center text-white mr-2.5 shadow group-hover:scale-105 transition-transform">
                                    <i className="fas fa-bolt text-sm"></i>
                                </div>
                                <span className="font-display text-2xl font-black tracking-tight">WINDSOR <span className="text-brand-500">EXPRESS</span></span>
                            </div>
                            <div className="flex items-center gap-2 md:gap-4">
                                <a href={`tel:${SHOP_PHONE}`} className="hidden md:flex items-center gap-2 text-sm font-bold text-gray-500 hover:text-gray-900 transition-colors">
                                    <i className="fas fa-phone text-brand-500 text-xs"></i> 07912 150397
                                </a>
                                <button onClick={() => setView('sell')} className="hidden md:block text-gray-500 font-bold hover:text-gray-900 transition-colors text-sm px-3 py-2">
                                    Sell Device
                                </button>
                                <button onClick={() => setView('booking')}
                                    className="bg-brand-500 hover:bg-brand-600 text-white font-black px-5 py-2.5 rounded-full shadow-lg transition-colors text-sm">
                                    Book Repair
                                </button>
                            </div>
                        </div>
                    </nav>

                    <TrustBar />

                    {/* ── HOME ── */}
                    {view === 'home' && (
                        <main className="flex-1">

                            {/* HERO */}
                            <section className="bg-white py-16 md:py-24 px-4 text-center relative overflow-hidden">
                                <div className="absolute inset-0 hero-dots opacity-[0.03]"></div>
                                <div className="relative max-w-4xl mx-auto">
                                    <div className="inline-flex items-center gap-2 bg-brand-50 border border-brand-100 text-brand-700 text-sm font-bold px-4 py-2 rounded-full mb-8">
                                        <span className="live-dot"></span>
                                        Open now · Peascod Street, Windsor
                                    </div>
                                    <h1 className="font-display text-7xl md:text-8xl lg:text-[108px] font-black text-gray-900 leading-none mb-5">
                                        Drop it?<br/>
                                        <span className="text-brand-500">We fix it.</span>
                                    </h1>
                                    <p className="text-gray-500 text-lg md:text-xl font-medium mb-12 max-w-xl mx-auto leading-relaxed">
                                        Screens fixed in <strong className="text-gray-800">under 30 minutes</strong>, right in the heart of Windsor. No fix, no fee — ever.
                                    </p>
                                    {renderFunnel()}
                                </div>
                            </section>

                            <StatsBar />
                            <HowItWorks />

                            {/* SELL BANNER */}
                            <section className="py-16 bg-gray-50 px-4">
                                <div className="max-w-5xl mx-auto">
                                    <div className="bg-gray-900 rounded-3xl p-8 md:p-12 flex flex-col md:flex-row items-center justify-between gap-8 relative overflow-hidden shadow-xl">
                                        <div className="absolute top-0 right-0 w-96 h-96 opacity-[0.06]"
                                            style={{ background: "radial-gradient(circle, #10b981 0%, transparent 70%)", transform: "translate(30%, -30%)" }}></div>
                                        <div className="relative text-center md:text-left">
                                            <div className="text-brand-400 font-bold text-xs uppercase tracking-widest mb-2">💸 Top Prices Paid</div>
                                            <h2 className="font-display text-4xl md:text-5xl font-black text-white mb-3">We Buy Old Phones</h2>
                                            <p className="text-gray-400 font-medium max-w-md leading-relaxed">Upgrading? Need quick cash? We pay top market rates for old or broken devices — instant offer, no hassle.</p>
                                        </div>
                                        <button onClick={() => setView('sell')}
                                            className="relative flex-shrink-0 bg-white text-gray-900 font-display font-black text-xl px-8 py-4 rounded-2xl hover:bg-gray-100 transition-colors whitespace-nowrap shadow-lg">
                                            Get Cash Quote →
                                        </button>
                                    </div>
                                </div>
                            </section>

                            {/* VAPE */}
                            <section className="py-16 bg-white border-t border-gray-100 px-4">
                                <div className="max-w-5xl mx-auto">
                                    <div className="text-center mb-10">
                                        <h2 className="font-display text-4xl md:text-5xl font-black text-gray-900 mb-2">While We Fix Your Phone...</h2>
                                        <p className="text-gray-400 font-medium">Browse our in-store vape selection</p>
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-6">
                                        <div className="bg-gray-50 p-8 rounded-3xl border border-gray-100 flex flex-col justify-center">
                                            <div className="w-14 h-14 bg-brand-50 text-brand-500 rounded-xl flex items-center justify-center text-2xl mb-5">
                                                <i className="fas fa-smoking"></i>
                                            </div>
                                            <h3 className="font-display text-3xl font-black text-gray-900 mb-3">Premium Vapes</h3>
                                            <p className="text-gray-500 font-medium leading-relaxed">Huge selection of disposables, e-liquids, coils, and kits. Something for every taste and budget.</p>
                                        </div>
                                        <div className="bg-gradient-to-br from-indigo-50 to-violet-50 p-8 rounded-3xl border border-indigo-100">
                                            <div className="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center text-2xl mb-5">
                                                <i className="fas fa-wand-magic-sparkles"></i>
                                            </div>
                                            <h3 className="font-display text-3xl font-black text-indigo-900 mb-1">Vape Matchmaker ✨</h3>
                                            <p className="text-indigo-400 text-sm font-medium mb-5">Tell us what flavours you enjoy and our AI will find your perfect in-store match.</p>
                                            <form onSubmit={handleVapeMatch} className="space-y-3">
                                                <input type="text" value={vapeInput} onChange={e => setVapeInput(e.target.value)}
                                                    placeholder="e.g. mango, mint, watermelon..." required
                                                    className="w-full p-4 border-2 border-indigo-100 focus:border-indigo-400 rounded-xl outline-none bg-white font-medium text-gray-700 placeholder-indigo-200 transition-colors" />
                                                <button type="submit" disabled={isVapeLoading}
                                                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition-colors disabled:opacity-50 flex items-center justify-center gap-2">
                                                    {isVapeLoading
                                                        ? <><div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> Finding...</>
                                                        : "Find My Flavour →"}
                                                </button>
                                            </form>
                                            {vapeResult && (
                                                <div className="mt-4 p-4 bg-white/70 rounded-xl text-indigo-800 text-sm font-medium leading-relaxed border border-indigo-100">
                                                    <i className="fas fa-robot mr-2 text-indigo-400"></i>{vapeResult}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </section>

                            {/* REVIEWS */}
                            <section className="py-16 bg-gray-50 border-t border-gray-100 px-4">
                                <div className="max-w-7xl mx-auto">
                                    <div className="text-center mb-10">
                                        <h2 className="font-display text-4xl md:text-5xl font-black text-gray-900 mb-2">Trusted by Windsor</h2>
                                        <div className="text-yellow-400 text-xl mb-1 tracking-wide">★★★★★</div>
                                        <p className="text-gray-400 font-medium text-sm">5.0 · Based on real Google reviews</p>
                                    </div>
                                    <div className="grid md:grid-cols-3 gap-5 max-w-6xl mx-auto">
                                        {[
                                            { name: "Jaipreet Bains", initial: "J", col: "bg-blue-100 text-blue-700",  time: "5 weeks ago",
                                              text: '"Done within 20 minutes, very professional messaging and scheduling like booking a slot and overall very good customer service and great experience!!! 10/10!"' },
                                            { name: "Shefak Alis",    initial: "S", col: "bg-red-100 text-red-700",    time: "4 weeks ago",
                                              text: '"The staff were really friendly and knowledgeable, and they helped replace the battery in my iPhone quickly and professionally. I\'d definitely recommend this shop!"' },
                                            { name: "Agnes Farrer",   initial: "A", col: "bg-green-100 text-green-700",time: "Yesterday",
                                              text: '"The best vape and food and drink and technology shop in the whole of Windsor — very welcoming owner and lovely vibes. Tanish is the best!"' }
                                        ].map(({ name, initial, col, time, text }, i) => (
                                            <div key={i} className="review-card bg-white p-7 rounded-2xl border border-gray-100 shadow-sm">
                                                <div className="flex justify-between items-start mb-4">
                                                    <div className="flex items-center gap-3">
                                                        <div className={`w-10 h-10 ${col} rounded-full flex items-center justify-center font-black text-lg`}>{initial}</div>
                                                        <div>
                                                            <div className="font-bold text-gray-900 text-sm">{name}</div>
                                                            <div className="text-xs text-gray-400">{time}</div>
                                                        </div>
                                                    </div>
                                                    <i className="fab fa-google text-gray-300 text-lg"></i>
                                                </div>
                                                <div className="text-yellow-400 text-sm mb-3">★★★★★</div>
                                                <p className="text-gray-600 text-sm leading-relaxed font-medium">{text}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </section>

                            <FAQSection />

                            {/* MAP */}
                            <section className="py-16 bg-gray-50 border-t border-gray-100 px-4">
                                <div className="max-w-6xl mx-auto text-center">
                                    <h2 className="font-display text-4xl md:text-5xl font-black text-gray-900 mb-2">Find Us</h2>
                                    <p className="text-gray-400 font-medium mb-8">Queen Annes Court, 3 Peascod St, Windsor SL4 1DG</p>
                                    <div className="h-[380px] rounded-3xl overflow-hidden shadow-xl border border-gray-200">
                                        <iframe src="https://maps.google.com/maps?q=Windsor%20Express,%20Queen%20Annes%20Court,%203%20Peascod%20St,%20Windsor%20SL4%201DG&t=&z=19&ie=UTF8&iwloc=&output=embed"
                                            className="w-full h-full border-0" allowFullScreen loading="lazy" referrerPolicy="no-referrer-when-downgrade" />
                                    </div>
                                </div>
                            </section>
                        </main>
                    )}

                    {view === 'booking' && (
                        <main className="py-12 bg-gray-50 flex-1 px-4">
                            <div className="max-w-7xl mx-auto">{renderFunnel()}</div>
                        </main>
                    )}

                    {view === 'sell' && (
                        <main className="py-12 bg-gray-50 flex-1 px-4">
                            <div className="max-w-7xl mx-auto">{renderSellPage()}</div>
                        </main>
                    )}

                    {/* FOOTER */}
                    <footer className="bg-gray-900 text-white pt-16 pb-8">
                        <div className="max-w-7xl mx-auto px-4 grid md:grid-cols-3 gap-10 mb-12">
                            <div>
                                <div className="flex items-center mb-4">
                                    <div className="w-8 h-8 bg-brand-500 rounded-lg flex items-center justify-center mr-2 text-white text-xs"><i className="fas fa-bolt"></i></div>
                                    <span className="font-display text-xl font-black">WINDSOR <span className="text-brand-400">EXPRESS</span></span>
                                </div>
                                <p className="text-gray-400 text-sm font-medium leading-relaxed">Windsor's most trusted phone repair shop. Fast, fair, and fully guaranteed.</p>
                            </div>
                            <div>
                                <h3 className="font-bold text-xs uppercase tracking-widest text-gray-500 mb-4">Contact</h3>
                                <p className="text-gray-400 text-sm mb-2 font-medium">3 Peascod St, Windsor SL4 1DG</p>
                                <a href={`tel:${SHOP_PHONE}`} className="text-white font-bold hover:text-brand-400 transition-colors flex items-center gap-2 text-sm">
                                    <i className="fas fa-phone text-brand-500 text-xs"></i> 07912 150397
                                </a>
                            </div>
                            <div>
                                <h3 className="font-bold text-xs uppercase tracking-widest text-gray-500 mb-4">Opening Hours</h3>
                                <div className="space-y-2 text-sm text-gray-400 font-medium">
                                    <p>Mon – Sat: 10:00 AM – 8:00 PM</p>
                                    <p>Sunday: 10:30 AM – 7:00 PM</p>
                                </div>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto px-4 border-t border-gray-800 pt-8 text-center text-gray-600 text-xs font-medium leading-relaxed">
                            <p className="mb-2">
                                <strong className="text-gray-500">Services:</strong> iPhone Screen Repair · Samsung Battery Replacement · iPad Repairs · Water Damage · Charging Port Fix · Cash for Phones · Device Trade-In · Premium Vapes
                            </p>
                            <p className="mb-4">
                                <strong className="text-gray-500">Areas Served:</strong> Windsor SL4 · Eton · Datchet · Old Windsor · Slough · Berkshire
                            </p>
                            <p>&copy; 2026 Windsor Express. All rights reserved.</p>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
