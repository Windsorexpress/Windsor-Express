<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Heavy Local SEO -->
    <title>Phone Repair Windsor | iPhone & Samsung Fixes | Windsor Express</title>
    <meta name="description" content="Windsor Express provides fast, 30-minute phone repairs on Peascod Street. We fix iPhone screens, Samsung batteries, and sell premium vapes. No fix, no fee.">
    <meta name="keywords" content="Phone repair Windsor, iPhone screen repair Windsor, Samsung repair Slough, fix phone screen Peascod street, mobile shop Windsor SL4">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: { brand: { 50: '#ecfdf5', 100: '#d1fae5', 400: '#34d399', 500: '#10b981', 600: '#059669', 900: '#064e3b' } }
                }
            }
        }
    </script>
    
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800;900&display=swap" rel="stylesheet">

    <!-- Schema.org Data for Google Maps/Search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ElectronicsRepairShop",
      "name": "Windsor Express",
      "telephone": "07912150397",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Queen Annes Court, 3 Peascod St",
        "addressLocality": "Windsor",
        "postalCode": "SL4 1DG",
        "addressCountry": "UK"
      },
      "priceRange": "££",
      "makesOffer": [
        {"@type": "Offer", "name": "iPhone Screen Replacement"},
        {"@type": "Offer", "name": "Samsung Battery Replacement"}
      ]
    }
    </script>

    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .funnel-card { transition: all 0.2s ease; cursor: pointer; }
        .funnel-card:hover { transform: translateY(-3px); border-color: #10b981; box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- CORE CONFIGURATION ---
        const OWNER_EMAIL = "tanish.ratala@gmail.com"; 
        const apiKey = "AIzaSyCrIHWXBa5PnlzlxIsl8Qy2_gjuHaioteU"; // Gemini API Key

        // --- HELPER: GEMINI API SENDER ---
        const callGemini = async (prompt, isJson = false) => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }]
            };
            if (isJson) {
                payload.generationConfig = { responseMimeType: "application/json" };
            }
            
            // Exponential backoff
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < 6; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    return isJson ? JSON.parse(text) : text;
                } catch (error) {
                    if (i === 5) {
                        console.error("Gemini API failed:", error);
                        return null;
                    }
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        };

        // --- HELPER: EMAIL SENDER ---
        const sendEmail = async (data) => {
            try {
                const response = await fetch(`https://formsubmit.co/ajax/${OWNER_EMAIL}`, {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ 
                        _subject: `🚨 NEW REPAIR BOOKING: ${data.brand} ${data.issue}`, 
                        "Device Brand": data.brand,
                        "Issue": data.issue,
                        "Screen Quality (If applicable)": data.quality || "N/A",
                        "Drop-off Time": data.time,
                        "Customer Phone": data.phone
                    })
                });
                return response.ok;
            } catch (error) {
                console.error("Email sending failed:", error);
                return false;
            }
        };

        // --- COMPONENT: TRUST BAR ---
        const TrustBar = () => (
            <div className="bg-brand-500 text-white py-3 shadow-md z-10 relative">
                <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-2 md:gap-4 text-center font-bold text-xs md:text-sm">
                    <div className="flex items-center justify-center"><i className="fas fa-lock mr-2"></i> 100% Data Safe Guarantee</div>
                    <div className="flex items-center justify-center"><i className="fas fa-shield-halved mr-2"></i> Premium Parts & 12-Mo Warranty</div>
                    <div className="flex items-center justify-center"><i className="fas fa-handshake mr-2"></i> No Fix, No Fee</div>
                </div>
            </div>
        );

        // --- TIME SLOTS GENERATOR ---
        const TIME_SLOTS = [];
        for (let hour = 10; hour <= 19; hour++) {
            const h = hour > 12 ? hour - 12 : hour;
            const ampm = hour >= 12 ? 'PM' : 'AM';
            TIME_SLOTS.push(`Today at ${h}:00 ${ampm}`);
            if (hour < 19) {
                TIME_SLOTS.push(`Today at ${h}:30 ${ampm}`);
            }
        }
        TIME_SLOTS.push("Tomorrow Any Time");

        // --- MAIN APP ---
        const App = () => {
            const [view, setView] = useState('home');
            
            // Funnel State
            const [funnelStep, setFunnelStep] = useState(1);
            const [bookingData, setBookingData] = useState({ brand: '', issue: '', quality: '', time: '', phone: '' });
            const [isSubmitting, setIsSubmitting] = useState(false);

            // AI Diagnostic State
            const [showAIPrompt, setShowAIPrompt] = useState(false);
            const [aiInput, setAiInput] = useState('');
            const [isAILoading, setIsAILoading] = useState(false);
            const [aiDiagnosisMsg, setAiDiagnosisMsg] = useState('');

            // Vape Matchmaker State
            const [vapeInput, setVapeInput] = useState('');
            const [vapeResult, setVapeResult] = useState('');
            const [isVapeLoading, setIsVapeLoading] = useState(false);

            // Popup State
            const [showExitIntent, setShowExitIntent] = useState(false);
            const hasSeenPopup = useRef(false);

            // Exit Intent Tracking (Desktop Mouse Leave + Mobile Idle Time)
            useEffect(() => {
                // Desktop: Mouse leaves top of screen
                const handleMouseLeave = (e) => {
                    if (e.clientY <= 0 && !hasSeenPopup.current) {
                        setShowExitIntent(true);
                        hasSeenPopup.current = true;
                    }
                };

                // Mobile: Idle for 45 seconds on the page without completing
                const idleTimer = setTimeout(() => {
                    if (!hasSeenPopup.current && funnelStep < 4) {
                        setShowExitIntent(true);
                        hasSeenPopup.current = true;
                    }
                }, 45000);

                document.addEventListener('mouseleave', handleMouseLeave);
                
                return () => {
                    document.removeEventListener('mouseleave', handleMouseLeave);
                    clearTimeout(idleTimer);
                };
            }, [funnelStep]);

            // --- NAVIGATION CONTROLLER ---
            const goToHome = () => {
                setView('home');
                setFunnelStep(1); // Reset funnel if they click logo
                setBookingData({ brand: '', issue: '', quality: '', time: '', phone: '' });
                setAiDiagnosisMsg('');
                setShowAIPrompt(false);
            };

            const goToBooking = () => {
                setView('booking');
            };

            // --- FUNNEL LOGIC ---
            const handleBrand = (brand) => { setBookingData({...bookingData, brand}); setFunnelStep(2); };
            const handleIssue = (issue, aiMsg = '') => { 
                setBookingData({...bookingData, issue}); 
                if (aiMsg) setAiDiagnosisMsg(aiMsg);
                if(issue === 'Screen') setFunnelStep(3); 
                else { setBookingData(prev => ({...prev, quality: 'N/A'})); setFunnelStep(4); }
            };
            const handleQuality = (quality) => { setBookingData({...bookingData, quality}); setFunnelStep(4); };
            
            const handleAIDiagnosis = async (e) => {
                e.preventDefault();
                if (!aiInput.trim()) return;
                setIsAILoading(true);
                
                const prompt = `You are a phone repair expert at Windsor Express. A customer describes their phone issue: "${aiInput}". 
                Diagnose the most likely hardware issue. You must respond with a JSON object containing two keys:
                "diagnosis_message": A friendly, reassuring explanation of the issue in under 30 words.
                "category": Must be exactly one of these strings: "Screen", "Battery", or "Port/Other".`;

                const result = await callGemini(prompt, true);
                setIsAILoading(false);

                if (result && result.category) {
                    handleIssue(result.category, result.diagnosis_message);
                } else {
                    handleIssue('Port/Other', "We couldn't quite diagnose that automatically, but our technicians can definitely take a look!");
                }
            };

            const handleVapeMatch = async (e) => {
                e.preventDefault();
                if (!vapeInput.trim()) return;
                setIsVapeLoading(true);
                
                const prompt = `You are a friendly vape shop assistant at Windsor Express. A customer says they like: "${vapeInput}".
                Recommend a popular disposable vape flavor profile or e-liquid type they would love. 
                Keep it punchy, engaging, under 30 words, and encourage them to try it in-store. Use a relevant emoji.`;

                const result = await callGemini(prompt, false);
                setIsVapeLoading(false);
                if (result) setVapeResult(result);
            };

            const submitBooking = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                
                const success = await sendEmail(bookingData);
                
                setIsSubmitting(false);
                if(success) {
                    alert("✅ Booking Confirmed! We'll see you at Windsor Express soon. Please check your text messages/emails later.");
                    goToHome();
                } else {
                    alert("❌ Connection error. Please text or call us at 07912150397 to confirm your booking.");
                }
            };

            // --- FUNNEL UI COMPONENT ---
            const renderFunnel = () => (
                <div className="max-w-3xl mx-auto bg-white rounded-3xl shadow-2xl border border-gray-100 overflow-hidden relative">
                    {/* Loading Overlay */}
                    {isSubmitting && (
                        <div className="absolute inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
                            <i className="fas fa-circle-notch fa-spin text-5xl text-brand-500 mb-4"></i>
                            <p className="font-bold text-lg">Locking in your slot...</p>
                        </div>
                    )}

                    <div className="bg-gray-50 p-6 border-b border-gray-100 flex justify-between items-center">
                        <h3 className="text-xl md:text-2xl font-black text-gray-800">Get Your Fix in 30 Mins</h3>
                        <span className="text-brand-600 font-bold bg-brand-100 px-3 py-1 rounded-full text-sm">Step {funnelStep} of 4</span>
                    </div>
                    
                    <div className="p-6 md:p-8 min-h-[400px]">
                        {/* Step 1: Brand */}
                        {funnelStep === 1 && (
                            <div className="fade-in">
                                <h4 className="text-2xl font-bold mb-8 text-center">What device needs fixing?</h4>
                                <div className="grid grid-cols-2 gap-4 md:gap-6">
                                    <div onClick={() => handleBrand('Apple iPhone')} className="funnel-card border-2 border-gray-200 rounded-2xl p-6 md:p-8 text-center bg-white">
                                        <i className="fab fa-apple text-5xl md:text-6xl mb-4 text-gray-800"></i>
                                        <div className="font-bold text-lg">Apple iPhone</div>
                                    </div>
                                    <div onClick={() => handleBrand('Samsung')} className="funnel-card border-2 border-gray-200 rounded-2xl p-6 md:p-8 text-center bg-white">
                                        <i className="fas fa-mobile-android text-5xl md:text-6xl mb-4 text-blue-600"></i>
                                        <div className="font-bold text-lg">Samsung</div>
                                    </div>
                                </div>
                                <div className="text-center mt-6">
                                    <button onClick={() => handleBrand('Other Brand (iPad/Laptop)')} className="text-gray-400 font-bold hover:text-brand-500 underline">Other Brand / Device</button>
                                </div>
                            </div>
                        )}

                        {/* Step 2: Issue */}
                        {funnelStep === 2 && !showAIPrompt && (
                            <div className="fade-in">
                                <button onClick={() => setFunnelStep(1)} className="text-sm text-gray-400 mb-6 hover:text-brand-500 font-bold"><i className="fas fa-arrow-left mr-1"></i> Back</button>
                                <h4 className="text-2xl font-bold mb-8 text-center">What's the main problem?</h4>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                                    <div onClick={() => handleIssue('Screen')} className="funnel-card border-2 border-gray-200 rounded-2xl p-6 text-center">
                                        <i className="fas fa-burst text-4xl mb-3 text-brand-500"></i>
                                        <div className="font-bold">Broken Screen</div>
                                    </div>
                                    <div onClick={() => handleIssue('Battery')} className="funnel-card border-2 border-gray-200 rounded-2xl p-6 text-center">
                                        <i className="fas fa-battery-quarter text-4xl mb-3 text-brand-500"></i>
                                        <div className="font-bold">Dead Battery</div>
                                    </div>
                                    <div onClick={() => handleIssue('Port/Other')} className="funnel-card border-2 border-gray-200 rounded-2xl p-6 text-center">
                                        <i className="fas fa-plug text-4xl mb-3 text-brand-500"></i>
                                        <div className="font-bold">Charging Port / Other</div>
                                    </div>
                                </div>
                                <div onClick={() => setShowAIPrompt(true)} className="funnel-card border-2 border-indigo-200 bg-indigo-50 rounded-2xl p-6 text-center text-indigo-700 shadow-md">
                                    <i className="fas fa-robot text-3xl mb-2"></i>
                                    <div className="font-bold text-lg">Not Sure? AI Diagnosis ✨</div>
                                    <div className="text-sm opacity-80 mt-1">Describe the problem and let our AI figure it out</div>
                                </div>
                            </div>
                        )}

                        {funnelStep === 2 && showAIPrompt && (
                            <div className="fade-in">
                                <button onClick={() => setShowAIPrompt(false)} className="text-sm text-gray-400 mb-6 hover:text-brand-500 font-bold"><i className="fas fa-arrow-left mr-1"></i> Back</button>
                                <h4 className="text-2xl font-bold mb-4 text-center text-indigo-800">Describe the Issue</h4>
                                <p className="text-center text-gray-500 mb-6">Tell us what's happening (e.g., "Screen is black but I hear sounds", "Doesn't hold charge").</p>
                                <form onSubmit={handleAIDiagnosis}>
                                    <textarea 
                                        value={aiInput}
                                        onChange={(e) => setAiInput(e.target.value)}
                                        className="w-full p-4 border-2 border-indigo-200 rounded-xl outline-none focus:border-indigo-500 min-h-[120px] mb-4 bg-white"
                                        placeholder="Type your issue here..."
                                        required
                                    ></textarea>
                                    <button type="submit" disabled={isAILoading} className="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 transition-colors shadow-lg disabled:opacity-50 flex justify-center items-center">
                                        {isAILoading ? <><i className="fas fa-spinner fa-spin mr-2"></i> Analyzing...</> : "Diagnose Issue ✨"}
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* Step 3: Screen Quality */}
                        {funnelStep === 3 && (
                            <div className="fade-in">
                                <button onClick={() => { setFunnelStep(2); setAiDiagnosisMsg(''); setShowAIPrompt(false); }} className="text-sm text-gray-400 mb-6 hover:text-brand-500 font-bold"><i className="fas fa-arrow-left mr-1"></i> Back</button>
                                <h4 className="text-2xl font-bold mb-8 text-center">Choose your screen quality</h4>
                                
                                {aiDiagnosisMsg && (
                                    <div className="bg-indigo-50 p-4 rounded-xl mb-6 border border-indigo-200 text-indigo-800 text-center animate-pulse-slow">
                                        <i className="fas fa-robot mb-2 text-xl"></i>
                                        <p className="font-medium text-sm"><strong>AI Diagnosis:</strong> {aiDiagnosisMsg}</p>
                                    </div>
                                )}

                                <div className="space-y-4">
                                    <div onClick={() => handleQuality('Standard Aftermarket')} className="funnel-card border-2 border-gray-200 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div>
                                            <div className="font-bold text-lg text-gray-800">Standard Aftermarket</div>
                                            <div className="text-sm text-gray-500 mt-1">Great value, perfect for getting back up and running.</div>
                                        </div>
                                        <div className="bg-gray-100 text-gray-800 px-4 py-2 rounded-lg font-bold text-sm w-full md:w-auto text-center">Budget Friendly</div>
                                    </div>
                                    <div onClick={() => handleQuality('Original OLED')} className="funnel-card border-2 border-brand-500 bg-brand-50 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-md shadow-green-100">
                                        <div>
                                            <div className="font-bold text-lg text-brand-700">Original Quality (OLED)</div>
                                            <div className="text-sm text-brand-600 mt-1">Vibrant colors, original touch sensitivity. Like it never happened.</div>
                                        </div>
                                        <div className="bg-brand-500 text-white px-4 py-2 rounded-lg font-bold text-sm w-full md:w-auto text-center"><i className="fas fa-star text-xs mr-1"></i> Recommended</div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Step 4: Final Details */}
                        {funnelStep === 4 && (
                            <div className="fade-in">
                                <button onClick={() => { setFunnelStep(bookingData.issue === 'Screen' ? 3 : 2); setAiDiagnosisMsg(''); if (bookingData.issue !== 'Screen') setShowAIPrompt(false); }} className="text-sm text-gray-400 mb-4 hover:text-brand-500 font-bold"><i className="fas fa-arrow-left mr-1"></i> Back</button>
                                <h4 className="text-2xl font-bold mb-6 text-center">Lock in your repair</h4>
                                
                                {aiDiagnosisMsg && bookingData.issue !== 'Screen' && (
                                    <div className="bg-indigo-50 p-4 rounded-xl mb-6 border border-indigo-200 text-indigo-800 text-center animate-pulse-slow">
                                        <i className="fas fa-robot mb-2 text-xl"></i>
                                        <p className="font-medium text-sm"><strong>AI Diagnosis:</strong> {aiDiagnosisMsg}</p>
                                    </div>
                                )}

                                <div className="bg-brand-50 p-4 rounded-xl mb-8 text-center border border-brand-200">
                                    <div className="text-sm text-brand-600 mb-1">Your Device</div>
                                    <div className="font-black text-lg text-brand-900">
                                        {bookingData.brand} - {bookingData.issue} {bookingData.quality && bookingData.quality !== 'N/A' ? `(${bookingData.quality})` : ''}
                                    </div>
                                </div>

                                <form onSubmit={submitBooking} className="space-y-5">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-2">When will you drop it off?</label>
                                        <select 
                                            value={bookingData.time} 
                                            onChange={(e) => setBookingData({...bookingData, time: e.target.value})}
                                            className="w-full p-4 border-2 border-gray-200 bg-gray-50 rounded-xl outline-none focus:border-brand-500 focus:bg-white font-medium" 
                                            required
                                        >
                                            <option value="">Select a drop-off time...</option>
                                            {TIME_SLOTS.map(slot => (
                                                <option key={slot} value={slot}>{slot}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-2">Your Mobile Number</label>
                                        <input 
                                            type="tel" 
                                            value={bookingData.phone}
                                            onChange={(e) => setBookingData({...bookingData, phone: e.target.value})}
                                            placeholder="07..." 
                                            className="w-full p-4 border-2 border-gray-200 bg-gray-50 rounded-xl outline-none focus:border-brand-500 focus:bg-white font-medium tracking-wide" 
                                            required 
                                            minLength="10"
                                        />
                                    </div>
                                    <button type="submit" disabled={isSubmitting} className="w-full bg-brand-500 text-white font-black text-lg py-5 rounded-xl hover:bg-brand-600 transition-colors shadow-lg shadow-brand-200/50 mt-4 disabled:opacity-70 disabled:cursor-not-allowed">
                                        {isSubmitting ? "Locking in..." : "Book 30-Min Repair Now"}
                                    </button>
                                    <p className="text-center text-xs font-bold text-gray-400 mt-4"><i className="fas fa-shield-check mr-1"></i> Pay in-store ONLY after you check the repair.</p>
                                </form>
                            </div>
                        )}
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col relative selection:bg-brand-200 selection:text-brand-900">
                    
                    {/* EXIT INTENT POPUP */}
                    {showExitIntent && (
                        <div className="fixed inset-0 bg-gray-900/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl">
                                <div className="bg-brand-500 p-6 text-center text-white relative">
                                    <button onClick={() => setShowExitIntent(false)} className="absolute top-4 right-4 text-white/70 hover:text-white"><i className="fas fa-times text-xl"></i></button>
                                    <h2 className="text-3xl font-black mb-1">Wait! Before you go...</h2>
                                    <p className="text-brand-100 font-medium">Don't risk your phone with cheap parts.</p>
                                </div>
                                <div className="p-8 text-center">
                                    <div className="text-6xl mb-4 animate-bounce">🎁</div>
                                    <h3 className="text-2xl font-black mb-4 text-gray-900">Book your repair right now and get a <span className="text-brand-500">FREE</span> Tempered Glass Protector</h3>
                                    <p className="text-gray-500 mb-8 font-medium">Worth £15. Fitted perfectly by our experts to prevent future breaks.</p>
                                    <div className="space-y-3">
                                        <button onClick={() => { setShowExitIntent(false); goToBooking(); }} className="w-full bg-gray-900 text-white font-bold py-4 rounded-xl hover:bg-black transition-colors shadow-lg">Claim Free Protector & Book</button>
                                        <button onClick={() => setShowExitIntent(false)} className="w-full bg-gray-100 text-gray-500 font-bold py-4 rounded-xl hover:bg-gray-200 transition-colors">No thanks, I'll risk it</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* HEADER */}
                    <nav className="glass sticky top-0 z-50 border-b border-gray-100 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 flex justify-between h-20 items-center">
                            <div onClick={goToHome} className="flex items-center cursor-pointer group">
                                <div className="w-10 h-10 bg-brand-500 rounded-lg flex items-center justify-center text-white mr-3 shadow-md group-hover:scale-105 transition-transform"><i className="fas fa-bolt"></i></div>
                                <div className="flex flex-col justify-center">
                                    <span className="text-2xl font-black tracking-tighter text-gray-900 leading-none">WINDSOR <span className="text-brand-500">EXPRESS</span></span>
                                </div>
                            </div>
                            <button onClick={goToBooking} className="bg-brand-500 hover:bg-brand-600 text-white font-bold px-6 py-2.5 rounded-full shadow-lg shadow-brand-200 transition-all active:scale-95 text-sm md:text-base">
                                Book Repair
                            </button>
                        </div>
                    </nav>

                    <TrustBar />

                    {/* CONDITIONAL VIEWS */}
                    {view === 'home' ? (
                        <main className="flex-1">
                            {/* HERO SECTION */}
                            <section className="bg-white py-12 md:py-20 px-4">
                                <div className="max-w-7xl mx-auto text-center">
                                    <span className="inline-flex items-center py-1 px-3 rounded-full bg-brand-50 text-brand-600 font-bold text-sm mb-6 border border-brand-100"><i className="fas fa-map-marker-alt mr-2"></i> Peascod Street, Windsor</span>
                                    <h1 className="text-5xl md:text-7xl font-black tracking-tight mb-6 text-gray-900 leading-tight">Drop it? <span className="text-brand-500">We fix it.</span></h1>
                                    <p className="text-lg md:text-xl text-gray-500 mb-12 max-w-2xl mx-auto font-medium">Windsor's trusted tech hub for ultra-fast screen repairs, battery replacements, and premium vapes. Most repairs done in under 30 minutes.</p>
                                    
                                    {/* INJECT FUNNEL INTO HOME */}
                                    <div className="mt-8 text-left">
                                        {renderFunnel()}
                                    </div>
                                </div>
                            </section>

                            {/* VAPE CROSS-SELL SECTION */}
                            <section className="py-20 bg-gray-50 border-t border-gray-200">
                                <div className="max-w-7xl mx-auto px-4 text-center">
                                    <h2 className="text-3xl md:text-4xl font-black mb-12 text-gray-900">While We Fix Your Phone...</h2>
                                    <div className="grid md:grid-cols-2 gap-8 max-w-5xl mx-auto">
                                        <div className="bg-white p-8 md:p-10 rounded-3xl shadow-sm border border-gray-100 transform hover:-translate-y-1 transition-transform flex flex-col justify-center">
                                            <div className="w-20 h-20 bg-brand-50 text-brand-500 rounded-2xl flex items-center justify-center text-4xl mx-auto mb-6">
                                                <i className="fas fa-smoking"></i>
                                            </div>
                                            <h3 className="text-2xl font-bold mb-4">Browse Our Premium Vapes</h3>
                                            <p className="text-gray-500 text-lg font-medium leading-relaxed">We stock Windsor's best selection of hardware, e-liquids, and disposables. Grab a coffee nearby or check out our inventory while our technicians get to work on your device.</p>
                                        </div>
                                        
                                        <div className="bg-white p-8 md:p-10 rounded-3xl shadow-sm border border-indigo-100 bg-gradient-to-br from-white to-indigo-50/50 flex flex-col justify-center">
                                            <div className="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center text-4xl mx-auto mb-6">
                                                <i className="fas fa-wand-magic-sparkles"></i>
                                            </div>
                                            <h3 className="text-2xl font-bold mb-4 text-indigo-900">Vape Matchmaker ✨</h3>
                                            <p className="text-gray-500 font-medium mb-6">Not sure what to try next? Tell our AI what flavors you usually like.</p>
                                            
                                            <form onSubmit={handleVapeMatch} className="flex flex-col gap-3">
                                                <input 
                                                    type="text" 
                                                    value={vapeInput}
                                                    onChange={(e) => setVapeInput(e.target.value)}
                                                    placeholder="e.g. sweet, icy, fruity, tobacco..." 
                                                    className="w-full p-4 border-2 border-indigo-100 rounded-xl outline-none focus:border-indigo-400 bg-white"
                                                    required
                                                />
                                                <button type="submit" disabled={isVapeLoading} className="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 transition-colors disabled:opacity-50">
                                                    {isVapeLoading ? <><i className="fas fa-spinner fa-spin mr-2"></i> Thinking...</> : "Find My Flavor ✨"}
                                                </button>
                                            </form>
                                            
                                            {vapeResult && (
                                                <div className="mt-4 p-4 bg-white border border-indigo-100 rounded-xl text-indigo-800 text-sm font-medium animate-fade-in text-left shadow-sm">
                                                    <i className="fas fa-robot mr-2 opacity-70"></i> {vapeResult}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </section>

                            {/* LOCATION / MAP SECTION */}
                            <section className="py-20 bg-white border-t border-gray-100">
                                <div className="max-w-7xl mx-auto px-4 text-center">
                                    <span className="inline-flex items-center py-1 px-3 rounded-full bg-brand-50 text-brand-600 font-bold text-sm mb-4 border border-brand-100"><i className="fas fa-location-dot mr-2"></i> Come say hi</span>
                                    <h2 className="text-3xl md:text-4xl font-black mb-6 text-gray-900">Find Us on Peascod Street</h2>
                                    <p className="text-lg text-gray-500 mb-10 max-w-2xl mx-auto font-medium">Drop in for a fast repair or to check out our vape selection. We're right in the heart of Windsor at Queen Annes Court, 3 Peascod St.</p>
                                    
                                    <div className="max-w-5xl mx-auto h-[400px] md:h-[500px] rounded-3xl overflow-hidden shadow-xl border border-gray-100 relative group">
                                        <div className="absolute inset-0 bg-brand-500/10 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-10"></div>
                                        <iframe 
                                            src="https://maps.google.com/maps?q=Windsor%20Express,%20Queen%20Annes%20Court,%203%20Peascod%20St,%20Windsor%20SL4%201DG&t=&z=19&ie=UTF8&iwloc=&output=embed" 
                                            className="w-full h-full border-0 relative z-0" 
                                            allowFullScreen="" 
                                            loading="lazy"
                                            referrerPolicy="no-referrer-when-downgrade">
                                        </iframe>
                                    </div>
                                </div>
                            </section>
                        </main>
                    ) : (
                        <main className="py-12 md:py-16 bg-gray-50 flex-1 px-4">
                            <div className="max-w-7xl mx-auto">
                                {renderFunnel()}
                            </div>
                        </main>
                    )}

                    {/* FOOTER */}
                    <footer className="bg-gray-900 text-white py-16 border-t border-gray-800">
                        <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-10 md:gap-8 text-center md:text-left">
                            <div>
                                <h3 className="text-2xl font-black mb-4 text-brand-400">Windsor Express</h3>
                                <p className="text-gray-400 font-medium">Queen Annes Court</p>
                                <p className="text-gray-400 font-medium">3 Peascod St, Windsor SL4 1DG</p>
                                <a href="tel:07912150397" className="inline-block mt-6 text-xl font-bold text-white hover:text-brand-400 transition-colors"><i className="fas fa-phone mr-2 text-brand-500"></i> 07912150397</a>
                            </div>
                            <div className="md:text-right">
                                <h3 className="text-xl font-bold mb-6 text-white">Opening Hours</h3>
                                <div className="space-y-3 font-medium text-gray-400">
                                    <p className="flex justify-between md:justify-end md:space-x-8"><span>Mon - Sat:</span> <span className="text-white">9:30 AM - 6:30 PM</span></p>
                                    <p className="flex justify-between md:justify-end md:space-x-8"><span>Sunday:</span> <span className="text-white">10:00 AM - 5:00 PM</span></p>
                                </div>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto px-4 mt-12 pt-8 border-t border-gray-800 text-center text-gray-500 text-sm font-medium">
                            &copy; 2026 Windsor Express. All rights reserved.
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
