<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Heavy Local SEO -->
    <title>Phone Repair Windsor | Sell Your Device & Trade-In | Windsor Express SL4</title>
    <meta name="description" content="Windsor's premier tech shop on Peascod Street. We offer 30-minute iPhone & Samsung repairs, pay top cash for old phones and trade-ins, and sell premium vapes. No fix, no fee.">
    <meta name="keywords" content="Phone repair Windsor, iPhone screen repair Windsor, Samsung repair Berkshire, fix phone screen Peascod street, mobile shop Windsor SL4, sell your device Windsor, phone trade in near me, cash for phones Windsor, buy back phones, cheap phone repair SL4, vape shop Peascod street">
    
    <!-- Open Graph / Social Media SEO -->
    <meta property="og:title" content="Windsor Express | Fast Phone Repairs & Trade-Ins">
    <meta property="og:description" content="Get your phone fixed in 30 minutes, or sell your old device for instant cash. Located on Peascod Street, Windsor.">
    <meta property="og:type" content="website">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: { brand: { 50: '#ecfdf5', 100: '#d1fae5', 400: '#34d399', 500: '#10b981', 600: '#059669', 900: '#064e3b' } }
                }
            }
        }
    </script>
    
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800;900&display=swap" rel="stylesheet">

    <!-- Schema.org Data for Google Maps/Search -->

    {
      "@context": "https://schema.org",
      "@type": ["ElectronicsStore", "MobilePhoneStore", "LocalBusiness"],
      "name": "Windsor Express",
      "telephone": "+447912150397",
      "description": "Windsor's top-rated mobile phone repair shop. We specialize in fast iPhone and Samsung screen repairs, battery replacements, device trade-ins, buying used phones for cash, and premium vaping products.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Queen Annes Court, 3 Peascod St",
        "addressLocality": "Windsor",
        "addressRegion": "Berkshire",
        "postalCode": "SL4 1DG",
        "addressCountry": "UK"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "51.4815",
        "longitude": "-0.6067"
      },
      "priceRange": "££",
      "makesOffer": [
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "iPhone Screen Replacement"}},
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Samsung Battery Replacement"}},
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Cash for Phones & Trade-In"}},
        {"@type": "Offer", "itemOffered": {"@type": "Product", "name": "Premium Disposables & E-Liquids"}}
      ]
    }
    </script>

    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .funnel-card { transition: all 0.2s ease; cursor: pointer; border-width: 2px; }
        .funnel-card:hover { transform: translateY(-3px); border-color: #10b981; box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- CORE CONFIGURATION ---
        const OWNER_EMAIL = "tanish.ratala@gmail.com"; 
        const SHOP_PHONE = "+447912150397";
        // WARNING: Ensure you restrict this API key to your domain in Google Cloud Console!
        const apiKey = "AIzaSyCrIHWXBa5PnlzlxIsl8Qy2_gjuHaioteU";

        // --- IPHONE PRICING DATA ---
        const IPHONE_PRICES = {
            "X / Xs / XR / 11": { lcd: 39.99, oled: 59.99 },
            "Xs Max": { lcd: 44.99, oled: 64.99 },
            "11 Pro": { lcd: 44.99, oled: 64.99 },
            "11 Pro Max": { lcd: 49.99, oled: 69.99 },
            "12 / 12 Mini": { lcd: 49.99, oled: 74.99 },
            "12 Pro / 12 Pro Max": { lcd: 54.99, oled: 79.99 },
            "13 / 13 Mini": { lcd: 54.99, oled: 84.99 },
            "13 Pro": { lcd: 64.99, fhd: 79.99, oled: 134.99 },
            "13 Pro Max": { lcd: 69.99, fhd: 84.99, oled: 139.99 },
            "14 / 14 Plus": { lcd: 59.99, oled: 94.99 },
            "14 Pro": { lcd: 69.99, fhd: 89.99, oled: 149.99 },
            "14 Pro Max": { lcd: 79.99, fhd: 99.99, oled: 154.99 },
            "15 / 15 Plus": { lcd: 74.99, fhd: 94.99, oled: 154.99 },
            "15 Pro": { lcd: 79.99, fhd: 99.99, oled: 159.99 },
            "15 Pro Max": { lcd: 89.99, fhd: 109.99, oled: 169.99 },
            "16 / 16 Plus": { lcd: 94.99, fhd: 114.99, oled: 174.99 },
            "16 Pro": { lcd: 109.99, fhd: 129.99, oled: 219.99 },
            "16 Pro Max": { lcd: 119.99, fhd: 139.99, oled: 229.99 },
            "17": { fhd: 169.99, oled: 249.99 },
            "17 Pro": { fhd: 179.99, oled: 279.99 },
            "17 Pro Max": { fhd: 189.99, oled: 289.99 }
        };

        // --- HELPER: GEMINI API SENDER ---
        const callGemini = async (prompt, isJson = false) => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            if (isJson) { payload.generationConfig = { responseMimeType: "application/json" }; }
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) return null;
                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                return isJson ? JSON.parse(text) : text;
            } catch (error) { return null; }
        };

        // --- EMAIL FUNCTIONS ---
        const sendEmail = async (data) => {
            try {
                const response = await fetch(`https://formsubmit.co/ajax/${OWNER_EMAIL}`, {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ 
                        _subject: `🚨 NEW ${data.serviceType.toUpperCase()} BOOKING: ${data.brand} ${data.model || ''}`, 
                        email: data.email, // Allows you to reply directly to the customer
                        name: data.name,
                        "Service Type": data.serviceType === 'mail-in' ? "📦 Mail-In Service" : "🏬 Walk-in",
                        "Device": `${data.brand} ${data.model || ''}`,
                        "Issue": data.issue,
                        "Quality": data.quality || "N/A",
                        "Price Quote": data.quotedPrice || "Needs Custom Quote",
                        "Drop-off Time (If Walk-in)": data.time || "N/A",
                        "Return Address (If Mail-in)": data.address || "N/A",
                        "Customer Name": data.name,
                        "Customer Email": data.email,
                        "Customer Phone": data.phone
                    })
                });
                return response.ok;
            } catch (error) { return false; }
        };

        const sendSellEmail = async (data) => {
            try {
                const response = await fetch(`https://formsubmit.co/ajax/${OWNER_EMAIL}`, {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ 
                        _subject: `💰 NEW DEVICE SELL INQUIRY: ${data.device}`, 
                        email: data.email,
                        name: data.name,
                        "Device to Sell": data.device,
                        "Condition": data.condition,
                        "Customer Name": data.name,
                        "Customer Email": data.email,
                        "Customer Phone": data.phone
                    })
                });
                return response.ok;
            } catch (error) { return false; }
        };

        const TrustBar = () => (
            <div className="bg-brand-500 text-white py-3 shadow-md z-10 relative">
                <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-2 md:gap-4 text-center font-bold text-xs md:text-sm">
                    <div className="flex items-center justify-center"><i className="fas fa-lock mr-2"></i> 100% Data Safe Guarantee</div>
                    <div className="flex items-center justify-center"><i className="fas fa-shield-halved mr-2"></i> Premium Parts & 12-Mo Warranty</div>
                    <div className="flex items-center justify-center"><i className="fas fa-handshake mr-2"></i> No Fix, No Fee</div>
                </div>
            </div>
        );

        const TIME_SLOTS = [];
        for (let hour = 10; hour <= 19; hour++) {
            const h = hour > 12 ? hour - 12 : hour;
            const ampm = hour >= 12 ? 'PM' : 'AM';
            TIME_SLOTS.push(`Today at ${h}:00 ${ampm}`);
            TIME_SLOTS.push(`Today at ${h}:30 ${ampm}`);
        }
        TIME_SLOTS.push("Tomorrow Any Time");

        const App = () => {
            const [view, setView] = useState('home'); // 'home', 'booking', 'sell'
            
            // Repair State
            const [funnelStep, setFunnelStep] = useState(1);
            const [bookingData, setBookingData] = useState({ serviceType: 'walk-in', brand: '', model: '', issue: '', quality: '', quotedPrice: '', time: '', phone: '', name: '', email: '', address: '' });
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            // Sell State
            const [sellData, setSellData] = useState({ device: '', condition: '', name: '', phone: '', email: '' });
            const [isSellSubmitting, setIsSellSubmitting] = useState(false);

            // AI/Vape State
            const [showAIPrompt, setShowAIPrompt] = useState(false);
            const [aiInput, setAiInput] = useState('');
            const [isAILoading, setIsAILoading] = useState(false);
            const [aiDiagnosisMsg, setAiDiagnosisMsg] = useState('');
            const [vapeInput, setVapeInput] = useState('');
            const [vapeResult, setVapeResult] = useState('');
            const [isVapeLoading, setIsVapeLoading] = useState(false);
            
            // Popup State
            const [showExitIntent, setShowExitIntent] = useState(false);
            const hasSeenPopup = useRef(false);

            useEffect(() => {
                const handleMouseLeave = (e) => {
                    if (e.clientY <= 0 && !hasSeenPopup.current) {
                        setShowExitIntent(true);
                        hasSeenPopup.current = true;
                    }
                };
                document.addEventListener('mouseleave', handleMouseLeave);
                return () => document.removeEventListener('mouseleave', handleMouseLeave);
            }, []);

            const goToHome = () => {
                setView('home');
                setFunnelStep(1);
                setBookingData({ serviceType: 'walk-in', brand: '', model: '', issue: '', quality: '', quotedPrice: '', time: '', phone: '', name: '', email: '', address: '' });
                setSellData({ device: '', condition: '', name: '', phone: '', email: '' });
                setAiDiagnosisMsg('');
                setShowAIPrompt(false);
            };

            // --- REPAIR LOGIC ---
            const handleBrand = (brand) => { 
                setBookingData(prev => ({ ...prev, brand, model: '', issue: '', quality: '', quotedPrice: '', time: '', phone: '', name: '', email: '', address: '' })); 
                setFunnelStep(2); 
            };

            const handleIssue = (issue, aiMsg = '') => { 
                setBookingData(prev => ({...prev, issue, model: '', quality: '', quotedPrice: ''})); 
                if (aiMsg) setAiDiagnosisMsg(aiMsg);
                if(issue === 'Screen' && bookingData.brand === 'Apple iPhone') setFunnelStep(3); 
                else { setFunnelStep(4); }
            };

            const handleModelSelect = (e) => {
                setBookingData({...bookingData, model: e.target.value, quality: '', quotedPrice: ''});
            };

            const handleQualitySelect = (qualityKey, price) => {
                const label = qualityKey === 'lcd' ? 'LCD (Gold Box)' : qualityKey === 'fhd' ? 'FHD (Black Box)' : 'OLED (Red Box)';
                setBookingData({...bookingData, quality: label, quotedPrice: `£${price.toFixed(2)}`});
                setFunnelStep(4);
            };

            const handleAIDiagnosis = async (e) => {
                e.preventDefault();
                if (!aiInput.trim()) return;
                setIsAILoading(true);
                const prompt = `Diagnose issue: "${aiInput}". Response JSON: {"diagnosis_message": "...", "category": "Screen|Battery|Port/Other"}`;
                const result = await callGemini(prompt, true);
                setIsAILoading(false);
                if (result) handleIssue(result.category, result.diagnosis_message);
                else handleIssue('Port/Other', "Our technicians will diagnose this in-store!");
            };

            const submitBooking = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                const success = await sendEmail(bookingData);
                setIsSubmitting(false);
                if(success) {
                    alert("✅ Booking Confirmed! See you at Windsor Express soon.");
                    goToHome();
                } else {
                    alert("❌ Error. Please call 07912 150397 to book.");
                }
            };

            // --- SELL LOGIC ---
            const submitSellQuote = async (e) => {
                e.preventDefault();
                setIsSellSubmitting(true);
                const success = await sendSellEmail(sellData);
                setIsSellSubmitting(false);
                if(success) {
                    alert("✅ Quote Request Sent! We will email or call you shortly with a cash offer.");
                    goToHome();
                } else {
                    alert("❌ Error. Please call us at 07912 150397 for a quote.");
                }
            };

            // --- VAPE LOGIC ---
            const handleVapeMatch = async (e) => {
                e.preventDefault();
                if (!vapeInput.trim()) return;
                setIsVapeLoading(true);
                const result = await callGemini(`Vape flavor advice for someone who likes "${vapeInput}". Short, catchy.`);
                setIsVapeLoading(false);
                if (result) setVapeResult(result);
            };

            // --- RENDER REPAIR FUNNEL ---
            const renderFunnel = () => (
                <div className="max-w-3xl mx-auto bg-white rounded-3xl shadow-2xl border border-gray-100 overflow-hidden relative">
                    {isSubmitting && (
                        <div className="absolute inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
                            <i className="fas fa-circle-notch fa-spin text-5xl text-brand-500 mb-4"></i>
                            <p className="font-bold text-lg">Locking in your slot...</p>
                        </div>
                    )}

                    <div className="bg-gray-50 p-6 border-b border-gray-100 flex justify-between items-center">
                        <h3 className="text-xl md:text-2xl font-black text-gray-800">Fast Repair Booking</h3>
                        <span className="text-brand-600 font-bold bg-brand-100 px-3 py-1 rounded-full text-sm">Step {funnelStep} of 4</span>
                    </div>
                    
                    <div className="p-6 md:p-8 min-h-[450px]">
                        {/* Service Type Toggle (Always visible on Step 1) */}
                        {funnelStep === 1 && (
                            <div className="flex bg-gray-100 rounded-xl p-1 mb-8 max-w-md mx-auto">
                                <button 
                                    onClick={() => setBookingData({...bookingData, serviceType: 'walk-in'})} 
                                    className={`flex-1 py-3 rounded-lg font-bold text-sm transition-all ${bookingData.serviceType === 'walk-in' ? 'bg-white shadow-sm text-brand-600' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    <i className="fas fa-store mr-2"></i>Walk-in
                                </button>
                                <button 
                                    onClick={() => setBookingData({...bookingData, serviceType: 'mail-in'})} 
                                    className={`flex-1 py-3 rounded-lg font-bold text-sm transition-all ${bookingData.serviceType === 'mail-in' ? 'bg-white shadow-sm text-brand-600' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    <i className="fas fa-box mr-2"></i>Mail-in (Nationwide)
                                </button>
                            </div>
                        )}

                        {funnelStep === 1 && (
                            <div className="fade-in">
                                <h4 className="text-2xl font-bold mb-8 text-center">What device needs fixing?</h4>
                                <div className="grid grid-cols-2 gap-4">
                                    <div onClick={() => handleBrand('Apple iPhone')} className="funnel-card border-gray-200 rounded-2xl p-6 text-center bg-white">
                                        <i className="fab fa-apple text-5xl mb-4 text-gray-800"></i>
                                        <div className="font-bold text-lg">Apple iPhone</div>
                                    </div>
                                    <div onClick={() => handleBrand('Samsung')} className="funnel-card border-gray-200 rounded-2xl p-6 text-center bg-white">
                                        <i className="fas fa-mobile-android text-5xl mb-4 text-blue-600"></i>
                                        <div className="font-bold text-lg">Samsung</div>
                                    </div>
                                </div>
                                <div className="text-center mt-6">
                                    <button onClick={() => handleBrand('Other/iPad/Laptop')} className="text-gray-400 font-bold hover:text-brand-500 underline">Other Brand / Device</button>
                                </div>
                            </div>
                        )}

                        {funnelStep === 2 && !showAIPrompt && (
                            <div className="fade-in">
                                <button onClick={() => setFunnelStep(1)} className="text-sm text-gray-400 mb-6 font-bold hover:text-brand-500"><i className="fas fa-arrow-left"></i> Back</button>
                                <h4 className="text-2xl font-bold mb-8 text-center">What is the problem?</h4>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                                    <div onClick={() => handleIssue('Screen')} className="funnel-card border-gray-200 rounded-2xl p-6 text-center">
                                        <i className="fas fa-burst text-4xl mb-3 text-brand-500"></i>
                                        <div className="font-bold">Broken Screen</div>
                                    </div>
                                    <div onClick={() => handleIssue('Battery')} className="funnel-card border-gray-200 rounded-2xl p-6 text-center">
                                        <i className="fas fa-battery-quarter text-4xl mb-3 text-brand-500"></i>
                                        <div className="font-bold">Battery Issue</div>
                                    </div>
                                    <div onClick={() => handleIssue('Other')} className="funnel-card border-gray-200 rounded-2xl p-6 text-center">
                                        <i className="fas fa-plug text-4xl mb-3 text-brand-500"></i>
                                        <div className="font-bold">Other Fix</div>
                                    </div>
                                </div>
                                <div onClick={() => setShowAIPrompt(true)} className="funnel-card border-indigo-200 bg-indigo-50 rounded-2xl p-6 text-center text-indigo-700 shadow-md">
                                    <i className="fas fa-robot text-3xl mb-2"></i>
                                    <div className="font-bold">Not Sure? AI Diagnosis ✨</div>
                                </div>
                            </div>
                        )}

                        {funnelStep === 2 && showAIPrompt && (
                            <div className="fade-in">
                                <button onClick={() => setShowAIPrompt(false)} className="text-sm text-gray-400 mb-6 font-bold"><i className="fas fa-arrow-left"></i> Back</button>
                                <h4 className="text-2xl font-bold mb-4 text-center">Describe the Issue</h4>
                                <form onSubmit={handleAIDiagnosis}>
                                    <textarea value={aiInput} onChange={(e) => setAiInput(e.target.value)} className="w-full p-4 border-2 border-indigo-100 rounded-xl outline-none focus:border-indigo-500 min-h-[120px] mb-4" placeholder="e.g. Screen is flickering..." required />
                                    <button type="submit" disabled={isAILoading} className="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg disabled:opacity-50">
                                        {isAILoading ? "Analyzing..." : "Diagnose ✨"}
                                    </button>
                                </form>
                            </div>
                        )}

                        {funnelStep === 3 && (
                            <div className="fade-in">
                                <button onClick={() => setFunnelStep(2)} className="text-sm text-gray-400 mb-6 font-bold hover:text-brand-500"><i className="fas fa-arrow-left"></i> Back</button>
                                <h4 className="text-2xl font-bold mb-6 text-center">Select Model & Quality</h4>
                                <div className="mb-8">
                                    <label className="block text-sm font-bold text-gray-600 mb-2">Select iPhone Model:</label>
                                    <select onChange={handleModelSelect} value={bookingData.model} className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-brand-500 bg-gray-50">
                                        <option value="">-- Choose Model --</option>
                                        {Object.keys(IPHONE_PRICES).map(m => <option key={m} value={m}>{m}</option>)}
                                    </select>
                                </div>

                                {bookingData.model && (
                                    <div className="grid gap-4">
                                        {Object.entries(IPHONE_PRICES[bookingData.model]).map(([qKey, price]) => (
                                            <div key={qKey} onClick={() => handleQualitySelect(qKey, price)} className="funnel-card border-gray-200 rounded-xl p-4 flex justify-between items-center hover:bg-brand-50 group">
                                                <div className="font-bold text-gray-800 uppercase">{qKey} Tier</div>
                                                <div className="text-brand-600 font-black text-xl">£{price.toFixed(2)}</div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {funnelStep === 4 && (
                            <div className="fade-in">
                                <button onClick={() => setFunnelStep(bookingData.brand === 'Apple iPhone' && bookingData.issue === 'Screen' ? 3 : 2)} className="text-sm text-gray-400 mb-4 font-bold hover:text-brand-500"><i className="fas fa-arrow-left"></i> Back</button>
                                <h4 className="text-2xl font-bold mb-6 text-center">Finalize Booking</h4>

                                <div className="bg-brand-50 p-5 rounded-2xl mb-6 text-center border border-brand-200">
                                    <div className="text-sm text-brand-600 font-bold mb-1">Your Selection</div>
                                    <div className="font-black text-lg text-brand-900">
                                        {bookingData.brand} {bookingData.model} {bookingData.issue} {bookingData.quality ? `(${bookingData.quality})` : ''}
                                        <div className="text-xs text-brand-600 uppercase mt-1 tracking-wider"><i className={`fas ${bookingData.serviceType === 'walk-in' ? 'fa-store' : 'fa-box'} mr-1`}></i> {bookingData.serviceType} service</div>
                                    </div>
                                    {bookingData.quotedPrice ? (
                                        <div className="text-2xl font-black text-brand-600 mt-2">Fixed Quote: {bookingData.quotedPrice}</div>
                                    ) : (
                                        <div className="mt-3 p-4 bg-white rounded-lg border border-brand-200 shadow-sm">
                                            <p className="text-sm font-bold text-gray-700 mb-1">Call for instant quote:</p>
                                            <a href={`tel:${SHOP_PHONE}`} className="text-2xl font-black text-brand-500 hover:text-brand-600 transition-colors">07912 150397</a>
                                        </div>
                                    )}
                                </div>

                                <form onSubmit={submitBooking} className="space-y-4">
                                    {bookingData.brand !== 'Apple iPhone' && (
                                        <input type="text" value={bookingData.model} onChange={(e) => setBookingData({...bookingData, model: e.target.value})} placeholder="Device Model (e.g. Galaxy S24 Ultra)" className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-brand-500" required />
                                    )}
                                    {bookingData.brand === 'Apple iPhone' && !bookingData.model && (
                                        <select value={bookingData.model} onChange={(e) => setBookingData({...bookingData, model: e.target.value})} className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-brand-500 bg-white" required>
                                            <option value="">Select iPhone Model...</option>
                                            {Object.keys(IPHONE_PRICES).map(m => <option key={m} value={m}>{m}</option>)}
                                        </select>
                                    )}
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <input type="text" value={bookingData.name} onChange={(e) => setBookingData({...bookingData, name: e.target.value})} placeholder="Your Full Name" className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-brand-500" required />
                                        <input type="tel" value={bookingData.phone} onChange={(e) => setBookingData({...bookingData, phone: e.target.value})} placeholder="Phone Number" className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-brand-500" required />
                                    </div>
                                    <input type="email" value={bookingData.email} onChange={(e) => setBookingData({...bookingData, email: e.target.value})} placeholder="Email Address" className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-brand-500" required />
                                    
                                    {bookingData.serviceType === 'walk-in' ? (
                                        <select value={bookingData.time} onChange={(e) => setBookingData({...bookingData, time: e.target.value})} className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-brand-500 bg-white" required>
                                            <option value="">Select drop-off time...</option>
                                            {TIME_SLOTS.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                    ) : (
                                        <div className="space-y-2">
                                            <textarea value={bookingData.address} onChange={(e) => setBookingData({...bookingData, address: e.target.value})} placeholder="Full Return Address" className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-brand-500 bg-white min-h-[100px]" required></textarea>
                                            <p className="text-xs text-gray-500 font-medium"><i className="fas fa-info-circle mr-1"></i> After booking, we will email you secure postage instructions.</p>
                                        </div>
                                    )}

                                    <button type="submit" className="w-full bg-brand-500 text-white font-black text-lg py-5 rounded-xl hover:bg-brand-600 shadow-lg transition-colors">
                                        {bookingData.serviceType === 'walk-in' ? "Book 30-Min Repair Now" : "Request Mail-In Repair"}
                                    </button>
                                </form>
                            </div>
                        )}
                    </div>
                </div>
            );

            // --- RENDER SELL PAGE ---
            const renderSellPage = () => (
                <div className="max-w-2xl mx-auto bg-white rounded-3xl shadow-2xl border border-gray-100 overflow-hidden relative fade-in">
                    {isSellSubmitting && (
                        <div className="absolute inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
                            <i className="fas fa-circle-notch fa-spin text-5xl text-blue-500 mb-4"></i>
                            <p className="font-bold text-lg">Sending Request...</p>
                        </div>
                    )}
                    
                    <div className="bg-gradient-to-r from-gray-900 to-gray-800 p-8 text-center text-white">
                        <div className="text-5xl mb-4">💸</div>
                        <h2 className="text-3xl font-black mb-2">Sell Your Device</h2>
                        <p className="text-gray-300 font-medium">Get a fast, fair cash offer for your old or broken phone.</p>
                    </div>

                    <div className="p-8">
                        <form onSubmit={submitSellQuote} className="space-y-5">
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">What device are you selling?</label>
                                <input type="text" value={sellData.device} onChange={(e) => setSellData({...sellData, device: e.target.value})} placeholder="e.g. iPhone 13 Pro, 128GB" className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-gray-800" required />
                            </div>
                            
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">What is the condition?</label>
                                <select value={sellData.condition} onChange={(e) => setSellData({...sellData, condition: e.target.value})} className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-gray-800 bg-white" required>
                                    <option value="">Select condition...</option>
                                    <option value="Flawless">Flawless (Looks brand new)</option>
                                    <option value="Good">Good (Minor wear and tear)</option>
                                    <option value="Poor/Broken">Poor / Broken (Cracked, dead battery, etc.)</option>
                                </select>
                            </div>

                            <hr className="my-6 border-gray-100"/>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">Your Name</label>
                                    <input type="text" value={sellData.name} onChange={(e) => setSellData({...sellData, name: e.target.value})} placeholder="Full Name" className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-gray-800" required />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">Phone Number</label>
                                    <input type="tel" value={sellData.phone} onChange={(e) => setSellData({...sellData, phone: e.target.value})} placeholder="07..." className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-gray-800" required />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">Email Address</label>
                                <input type="email" value={sellData.email} onChange={(e) => setSellData({...sellData, email: e.target.value})} placeholder="Email to receive quote" className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-gray-800" required />
                            </div>

                            <button type="submit" className="w-full bg-gray-900 text-white font-black text-lg py-5 rounded-xl hover:bg-black shadow-lg transition-colors mt-4">Get Cash Quote</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col relative selection:bg-brand-200">
                    
                    {/* Floating WhatsApp Button */}
                    <a href={`https://wa.me/447912150397`} target="_blank" rel="noopener noreferrer" className="fixed bottom-6 right-6 bg-[#25D366] text-white w-16 h-16 rounded-full flex items-center justify-center text-3xl shadow-2xl hover:bg-[#1ebd5a] hover:scale-110 transition-all z-50 animate-bounce">
                        <i className="fab fa-whatsapp"></i>
                    </a>

                    {showExitIntent && (
                        <div className="fixed inset-0 bg-gray-900/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl">
                                <div className="bg-brand-500 p-6 text-center text-white relative">
                                    <button onClick={() => setShowExitIntent(false)} className="absolute top-4 right-4 text-white/70 hover:text-white"><i className="fas fa-times text-xl"></i></button>
                                    <h2 className="text-3xl font-black">Wait! Free Gift...</h2>
                                </div>
                                <div className="p-8 text-center">
                                    <div className="text-6xl mb-4 animate-bounce">🎁</div>
                                    <h3 className="text-2xl font-black mb-4">Get a <span className="text-brand-500">FREE</span> Screen Protector</h3>
                                    <p className="text-gray-500 mb-8 font-medium">Book now and we'll fit a premium glass protector worth £15 for free.</p>
                                    <div className="space-y-3">
                                        <button onClick={() => { setShowExitIntent(false); setView('booking'); }} className="w-full bg-gray-900 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-black transition-colors">Claim & Book Now</button>
                                        <button onClick={() => setShowExitIntent(false)} className="w-full bg-gray-100 text-gray-500 font-bold py-4 rounded-xl hover:bg-gray-200 transition-colors">No thanks, I'll risk it</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <nav className="glass sticky top-0 z-50 border-b border-gray-100 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 flex justify-between h-20 items-center">
                            <div onClick={goToHome} className="flex items-center cursor-pointer group">
                                <div className="w-10 h-10 bg-brand-500 rounded-lg flex items-center justify-center text-white mr-3 shadow-md group-hover:scale-105 transition-transform"><i className="fas fa-bolt"></i></div>
                                <span className="text-2xl font-black tracking-tighter">WINDSOR <span className="text-brand-500">EXPRESS</span></span>
                            </div>
                            <div className="flex items-center space-x-4 md:space-x-6">
                                <button onClick={() => setView('sell')} className="text-gray-500 font-bold hover:text-gray-900 transition-colors text-sm md:text-base">Sell Device</button>
                                <button onClick={() => setView('booking')} className="bg-brand-500 text-white font-bold px-5 md:px-6 py-2 md:py-2.5 rounded-full shadow-lg hover:bg-brand-600 transition-colors text-sm md:text-base">Book Repair</button>
                            </div>
                        </div>
                    </nav>

                    <TrustBar />

                    {view === 'home' ? (
                        <main className="flex-1">
                            {/* REPAIR HERO */}
                            <section className="bg-white py-12 px-4 text-center">
                                <h1 className="text-5xl md:text-7xl font-black mb-6 text-gray-900">Drop it? <span className="text-brand-500">We fix it.</span></h1>
                                <p className="text-lg text-gray-500 mb-12 max-w-2xl mx-auto font-medium">Peascod Street's favorite tech shop. Screens fixed in 30 minutes with the best local prices.</p>
                                {renderFunnel()}
                            </section>

                            {/* SELL BANNER ADDED HERE */}
                            <section className="py-12 bg-white border-t border-gray-100">
                                <div className="max-w-4xl mx-auto px-4">
                                    <div className="bg-gray-900 rounded-3xl p-8 md:p-12 text-center text-white flex flex-col md:flex-row items-center justify-between shadow-xl">
                                        <div className="text-left mb-6 md:mb-0 md:mr-8">
                                            <h2 className="text-3xl md:text-4xl font-black mb-3 text-brand-400">We Buy Old Phones</h2>
                                            <p className="text-gray-300 text-lg">Upgrading? Need cash? We offer top market rates for your old or broken devices.</p>
                                        </div>
                                        <button onClick={() => setView('sell')} className="w-full md:w-auto bg-white text-gray-900 font-black px-8 py-4 rounded-xl hover:bg-gray-100 transition-colors whitespace-nowrap shadow-lg">Get Cash Quote</button>
                                    </div>
                                </div>
                            </section>

                            <section className="py-20 bg-gray-50 border-t border-gray-200">
                                <div className="max-w-7xl mx-auto px-4 text-center">
                                    <h2 className="text-3xl font-black mb-12 text-gray-900">While We Fix Your Phone...</h2>
                                    <div className="grid md:grid-cols-2 gap-8 max-w-5xl mx-auto">
                                        <div className="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm">
                                            <div className="w-16 h-16 bg-brand-50 text-brand-500 rounded-xl flex items-center justify-center text-3xl mx-auto mb-6"><i className="fas fa-smoking"></i></div>
                                            <h3 className="text-2xl font-bold mb-4 text-gray-900">Premium Vapes</h3>
                                            <p className="text-gray-500 font-medium">Huge selection of disposables and liquids available in-store.</p>
                                        </div>
                                        <div className="bg-white p-8 rounded-3xl border border-indigo-100 bg-gradient-to-br from-white to-indigo-50/30">
                                            <div className="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center text-3xl mx-auto mb-6"><i className="fas fa-wand-magic-sparkles"></i></div>
                                            <h3 className="text-2xl font-bold mb-4 text-indigo-900">Vape Matchmaker ✨</h3>
                                            <form onSubmit={handleVapeMatch} className="flex flex-col gap-3">
                                                <input type="text" value={vapeInput} onChange={(e) => setVapeInput(e.target.value)} placeholder="Flavors you like..." className="p-4 border-2 border-indigo-100 rounded-xl outline-none focus:border-indigo-400 bg-white" required />
                                                <button type="submit" disabled={isVapeLoading} className="bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 transition-colors">{isVapeLoading ? "Thinking..." : "Find My Flavor"}</button>
                                            </form>
                                            {vapeResult && <div className="mt-4 text-indigo-800 text-sm font-medium"><i className="fas fa-robot mr-2 opacity-70"></i>{vapeResult}</div>}
                                        </div>
                                    </div>
                                </div>
                            </section>
                            
                            {/* NEW: GOOGLE REVIEWS SECTION (WITH REAL REVIEWS) */}
                            <section className="py-20 bg-white border-t border-gray-100">
                                <div className="max-w-7xl mx-auto px-4">
                                    <div className="text-center mb-12">
                                        <h2 className="text-3xl font-black mb-4 text-gray-900">Trusted by Windsor</h2>
                                        <div className="flex items-center justify-center text-yellow-400 text-2xl mb-2">
                                            <i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i>
                                        </div>
                                        <p className="text-gray-500 font-medium">5.0 Average Rating • Based on real customer reviews</p>
                                    </div>
                                    <div className="grid md:grid-cols-3 gap-6 max-w-6xl mx-auto">
                                        {/* Review 1: Jaipreet (Speed & High End Screen) */}
                                        <div className="bg-gray-50 p-8 rounded-2xl border border-gray-200 shadow-sm hover:shadow-md transition-shadow">
                                            <div className="flex justify-between items-start mb-4">
                                                <div className="flex items-center">
                                                    <div className="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold text-lg mr-3">J</div>
                                                    <div>
                                                        <div className="font-bold text-gray-900">Jaipreet Bains</div>
                                                        <div className="text-xs text-gray-500">5 weeks ago</div>
                                                    </div>
                                                </div>
                                                <i className="fab fa-google text-gray-400 text-xl"></i>
                                            </div>
                                            <div className="text-yellow-400 text-sm mb-3">
                                                <i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i>
                                            </div>
                                            <p className="text-gray-600">"i went in for a iphone 15 pro max screen repair after having a very bad experience. it was done within 20 minutes, very professional messaging and scheduling like booking a slot and overall very good customer service and great experience!!! 10/10!"</p>
                                        </div>
                                        
                                        {/* Review 2: Shefak (Battery & Professionalism) */}
                                        <div className="bg-gray-50 p-8 rounded-2xl border border-gray-200 shadow-sm hover:shadow-md transition-shadow">
                                            <div className="flex justify-between items-start mb-4">
                                                <div className="flex items-center">
                                                    <div className="w-10 h-10 bg-red-100 text-red-600 rounded-full flex items-center justify-center font-bold text-lg mr-3">S</div>
                                                    <div>
                                                        <div className="font-bold text-gray-900">Shefak Alis</div>
                                                        <div className="text-xs text-gray-500">4 weeks ago</div>
                                                    </div>
                                                </div>
                                                <i className="fab fa-google text-gray-400 text-xl"></i>
                                            </div>
                                            <div className="text-yellow-400 text-sm mb-3">
                                                <i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i>
                                            </div>
                                            <p className="text-gray-600">"I had a great experience at this mobile repair store. The staff were really friendly and knowledgeable, and they helped replace the battery in my iPhone quickly and professionally. I’d definitely recommend this shop!"</p>
                                        </div>
                                        
                                        {/* Review 3: Agnes (Vape, Snacks, Tanish Shoutout) */}
                                        <div className="bg-gray-50 p-8 rounded-2xl border border-gray-200 shadow-sm hover:shadow-md transition-shadow">
                                            <div className="flex justify-between items-start mb-4">
                                                <div className="flex items-center">
                                                    <div className="w-10 h-10 bg-green-100 text-green-600 rounded-full flex items-center justify-center font-bold text-lg mr-3">A</div>
                                                    <div>
                                                        <div className="font-bold text-gray-900">Agnes Farrer</div>
                                                        <div className="text-xs text-gray-500">Yesterday</div>
                                                    </div>
                                                </div>
                                                <i className="fab fa-google text-gray-400 text-xl"></i>
                                            </div>
                                            <div className="text-yellow-400 text-sm mb-3">
                                                <i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i><i className="fas fa-star"></i>
                                            </div>
                                            <p className="text-gray-600">"The best vape and food and drink and technology shop in the whole of Windsor very welcoming owner and lovely vibes all over and doesn’t scam, Tanish is the best!"</p>
                                        </div>
                                    </div>
                                </div>
                            </section>

                            <section className="py-20 bg-gray-50 border-t border-gray-100">
                                <div className="max-w-7xl mx-auto px-4 text-center">
                                    <h2 className="text-3xl font-black mb-6 text-gray-900">Find Us on Peascod Street</h2>
                                    <p className="text-lg text-gray-500 mb-10 max-w-2xl mx-auto font-medium">Right in the heart of Windsor at Queen Annes Court, 3 Peascod St.</p>
                                    <div className="max-w-5xl mx-auto h-[400px] rounded-3xl overflow-hidden shadow-xl border border-gray-100">
                                        <iframe 
                                            src="https://maps.google.com/maps?q=Windsor%20Express,%20Queen%20Annes%20Court,%203%20Peascod%20St,%20Windsor%20SL4%201DG&t=&z=19&ie=UTF8&iwloc=&output=embed" 
                                            className="w-full h-full border-0" 
                                            allowFullScreen={true}
                                            loading="lazy"
                                            referrerPolicy="no-referrer-when-downgrade">
                                        </iframe>
                                    </div>
                                </div>
                            </section>
                        </main>
                    ) : view === 'booking' ? (
                        <main className="py-12 bg-gray-50 flex-1 px-4">
                            <div className="max-w-7xl mx-auto">
                                {renderFunnel()}
                            </div>
                        </main>
                    ) : (
                        <main className="py-12 bg-gray-50 flex-1 px-4">
                            <div className="max-w-7xl mx-auto">
                                {renderSellPage()}
                            </div>
                        </main>
                    )}

                    <footer className="bg-gray-900 text-white py-16 text-center md:text-left">
                        <div className="max-w-7xl mx-auto px-4 grid md:grid-cols-2 gap-10">
                            <div>
                                <h3 className="text-2xl font-black mb-4 text-brand-400">Windsor Express</h3>
                                <p className="text-gray-400 font-medium">3 Peascod St, Windsor SL4 1DG</p>
                                <a href={`tel:${SHOP_PHONE}`} className="inline-block mt-6 text-xl font-bold text-white hover:text-brand-400 transition-colors"><i className="fas fa-phone mr-2 text-brand-500"></i> 07912 150397</a>
                            </div>
                            <div className="md:text-right">
                                <h3 className="text-xl font-bold mb-6">Opening Hours</h3>
                                <div className="space-y-2 text-gray-400 font-medium">
                                    <p>Mon - Sat: 10:00 AM - 8:00 PM</p>
                                    <p>Sunday: 10:30 AM - 7:00 PM</p>
                                </div>
                            </div>
                        </div>
                        
                        {/* SEO Overload Footer Section */}
                        <div className="max-w-7xl mx-auto px-4 mt-12 pt-8 border-t border-gray-800 text-center text-gray-500 text-xs font-medium leading-relaxed">
                            <h2 className="sr-only">Windsor Express Services & Service Areas</h2>
                            <p className="mb-2">
                                <strong className="text-gray-400">Our Windsor Services:</strong> Fast iPhone Screen Repair, Samsung Battery Replacement, iPad Repairs, Screen Fixes, Water Damage Repair, Charging Port Fixes. <strong className="text-gray-400">Sell & Trade:</strong> Cash for Phones, Sell Your Device, Trade-In Old iPhones, Buy Back Mobiles. <strong className="text-gray-400">Vape Shop:</strong> Premium Disposables, E-Liquids, Coils & Kits.
                            </p>
                            <p className="mb-4">
                                <strong className="text-gray-400">Proudly Serving:</strong> Peascod Street, Windsor (SL4), Eton, Datchet, Old Windsor, Slough, and surrounding Berkshire areas.
                            </p>
                            <p>&copy; 2026 Windsor Express. All rights reserved.</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
